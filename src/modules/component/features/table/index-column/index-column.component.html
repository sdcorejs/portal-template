<sd-page title="sd-table — Cột STT (index)" [description]="pageDescription()">
  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <!-- CỘT TRÁI: THUỘC TÍNH -->
      <div class="col-md-4">
        <sd-section title="Thuộc tính" icon="settings"
          ><div class="demo-property-content">
            <div class="d-flex flex-column gap-12">
              <app-demo-property label="index.enabled">
                <span propertyDescription>Bật/tắt cột STT — render thêm cột sticky đầu</span>
                <sd-switch [(model)]="indexEnabled" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="index.title">
                <span propertyDescription>Tiêu đề header của cột STT (mặc định '#')</span>
                <sd-input [(model)]="indexTitle" [disabled]="!indexEnabled()" hideInlineError size="sm"></sd-input
              ></app-demo-property>

              <app-demo-property label="index.width">
                <span propertyDescription>Chiều rộng cột STT (mặc định '50px')</span>
                <sd-input [(model)]="indexWidth" [disabled]="!indexEnabled()" hideInlineError size="sm"></sd-input
              ></app-demo-property>

              <app-demo-property label="selector.visible">
                <span propertyDescription>Cột checkbox — STT render ngay sau selector</span>
                <sd-switch [(model)]="showSelector" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="paginate.pageSize">
                <span propertyDescription>Chuyển trang để xác nhận STT vẫn tính theo global index</span>
                <sd-select
                  [items]="pageSizeOptions"
                  valueField="id"
                  displayField="name"
                  [(model)]="pageSize"
                  hideInlineError
                  size="sm"></sd-select
              ></app-demo-property>

              <div class="hint-box">
                💡 Sang trang 2 — STT bắt đầu từ <strong>{{ pageSize() + 1 }}</strong
                >, không reset về 1.
              </div>
            </div>
          </div></sd-section
        >
      </div>

      <!-- CỘT PHẢI: XEM TRƯỚC + MÃ NGUỒN -->
      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Xem trước" icon="visibility"
            ><div class="demo-section-content">
              <div style="height: 500px; overflow: auto">
                <sd-table [option]="tableOption()"></sd-table>
              </div></div
          ></sd-section>

          <sd-section title="Mã nguồn" icon="code"
            ><div class="demo-section-content">
              <sd-code-editor [model]="tsCode()" language="typescript" maxHeight="480px" [viewed]="true"></sd-code-editor></div
          ></sd-section>
        </div>
      </div>
    </div>
  </div>
</sd-page>
