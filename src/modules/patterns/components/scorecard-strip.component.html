<div class="scores" [class.compact]="compact()" [class.tiles]="iconLayout() === 'tile'">
  @for (card of cards(); track card.id) {
    @if (interactive()) {
      <button
        type="button"
        class="score"
        [attr.aria-pressed]="selected() === card.id"
        [attr.data-tone]="card.tone"
        (click)="choose(card.id)">
        <span class="label-line">
          @if (iconLayout() !== 'none') {
            <span class="symbol" [class.tile]="iconLayout() === 'tile'"
              ><mat-icon aria-hidden="true">{{ card.icon }}</mat-icon></span
            >
          }
          <span>{{ card.label }}</span></span
        >
        <strong>{{ card.value }}</strong
        ><span class="hint">{{ selected() === card.id ? '✓ Đang lọc' : card.hint }}</span>
      </button>
    } @else {
      <div class="score" [attr.data-tone]="card.tone">
        <span class="label-line">
          @if (iconLayout() !== 'none') {
            <span class="symbol" [class.tile]="iconLayout() === 'tile'"
              ><mat-icon aria-hidden="true">{{ card.icon }}</mat-icon></span
            >
          }
          <span>{{ card.label }}</span></span
        >
        <strong>{{ card.value }}</strong>
        @if (card.progress !== undefined) {
          <progress [value]="card.progress" max="100" [attr.aria-label]="card.label"></progress>
        }
        <span class="hint">{{ card.hint }}</span>
      </div>
    }
  }
</div>
