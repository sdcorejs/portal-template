name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main        # → prod
      - develop     # → dev
      - release/qc  # → qc
      - release/uat # → uat
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qc
          - uat
          - prod

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "config=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "config=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/release/uat" ]; then
            echo "config=uat" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/release/qc" ]; then
            echo "config=qc" >> "$GITHUB_OUTPUT"
          else
            echo "config=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (${{ steps.env.outputs.config }})
        run: npm run build-${{ steps.env.outputs.config }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          target: cs-portal-template
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
