<sd-page [title]="'SdCheckbox Component'" [description]="pageDescription()">
  <div headerRight>
    <div class="d-flex gap-8"></div>
  </div>

  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <!-- CỘT TRÁI: CONFIGURATION -->
      <div class="col-md-4">
        <sd-section title="Thuộc tính" icon="settings">
          <div class="demo-config-panel">
            <div class="config-item">
              <div class="config-item__label">
                <span class="config-item__title">label</span>
                <span class="config-item__desc">Nhãn hiển thị cạnh ô tích.</span>
              </div>
              <sd-input [label]="'Label'" [(model)]="label"></sd-input>
            </div>

            <div class="config-item">
              <div class="config-item__label">
                <span class="config-item__title">color</span>
                <span class="config-item__desc">Bộ màu áp dụng cho ô tích: primary hoặc warn.</span>
              </div>
              <sd-select [label]="'Color'" [items]="colorOptions" valueField="id" displayField="name" [(model)]="color"></sd-select>
            </div>

            <div class="config-item">
              <div class="config-item__label">
                <span class="config-item__title">disabled</span>
                <span class="config-item__desc">Khoá tương tác với checkbox.</span>
              </div>
              <sd-switch [(model)]="disabled" size="sm"></sd-switch>
            </div>

            <div class="config-item">
              <div class="config-item__label">
                <span class="config-item__title">viewed</span>
                <span class="config-item__desc">Chuyển control sang chế độ hiển thị (read-only).</span>
              </div>
              <sd-switch [(model)]="viewed" size="sm"></sd-switch>
            </div>

            <div class="config-item">
              <div class="config-item__label">
                <span class="config-item__title">inlineError</span>
                <span class="config-item__desc">Chuỗi lỗi hiển thị inline dưới checkbox khi cần.</span>
              </div>
              <sd-input [label]="'Inline Error'" [(model)]="inlineError"></sd-input>
            </div>
          </div>
        </sd-section>
      </div>

      <!-- CỘT PHẢI: PREVIEW & CODE -->
      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Xem trước" icon="visibility">
            <div
              class="p-24 bg-slate-100 rounded-8 border border-dashed border-slate-300 d-flex align-items-center justify-content-center">
              <sd-checkbox
                [(model)]="modelValue"
                [label]="label()"
                [color]="color()"
                [disabled]="disabled()"
                [viewed]="viewed()"
                [inlineError]="inlineError()">
              </sd-checkbox>
            </div>
            <div class="mt-16 font-size-13">
              <span class="T16M">Giá trị hiện tại:</span> {{ modelValue() }}
            </div>
          </sd-section>

          <sd-section title="Mã nguồn" icon="code">
            <h4 class="font-size-14 mb-8">HTML</h4>
            <sd-code-editor [model]="htmlCode()" language="html" maxHeight="300px" [viewed]="true"></sd-code-editor>
            <h4 class="font-size-14 mb-8 mt-16">Typescript</h4>
            <sd-code-editor [model]="tsCode" language="typescript" maxHeight="300px" [viewed]="true"></sd-code-editor>
          </sd-section>
        </div>
      </div>
    </div>
  </div>
</sd-page>
