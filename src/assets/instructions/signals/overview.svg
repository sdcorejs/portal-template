<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Signals &amp; Component APIs</title><desc id="desc">Parent truyền đơn giá qua input; child giữ quantity bằng model; computed tính tổng; output báo thêm hàng về parent.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7c8fa8" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" fill="#fafcff"/><path d="M0 96H1120" stroke="#dfe7f2"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#005cca">SDCOREJS · ANGULAR HIỆN ĐẠI</text><text x="32" y="68" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#182a43">Signals &amp; Component APIs</text><path d="M264 203H294" stroke="#7c8fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="130" width="232" height="148" rx="12" fill="white" stroke="#6655c5" stroke-opacity=".4"/><rect x="48" y="146" width="34" height="34" rx="9" fill="#6655c5" fill-opacity=".1"/><text x="65" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#6655c5">1</text><text x="48" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243650">Parent</text><text x="48" y="248" font-family="Arial,sans-serif" font-size="14" fill="#53677e">price · quantity</text><path d="M538 203H568" stroke="#7c8fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="306" y="130" width="232" height="148" rx="12" fill="white" stroke="#12806d" stroke-opacity=".4"/><rect x="322" y="146" width="34" height="34" rx="9" fill="#12806d" fill-opacity=".1"/><text x="339" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#12806d">2</text><text x="322" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243650">Child input / model</text><text x="322" y="248" font-family="Arial,sans-serif" font-size="14" fill="#53677e">unitPrice · quantity</text><path d="M812 203H842" stroke="#7c8fa8" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="130" width="232" height="148" rx="12" fill="white" stroke="#0063cc" stroke-opacity=".4"/><rect x="596" y="146" width="34" height="34" rx="9" fill="#0063cc" fill-opacity=".1"/><text x="613" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0063cc">3</text><text x="596" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243650">computed</text><text x="596" y="248" font-family="Arial,sans-serif" font-size="14" fill="#53677e">total = price × qty</text><rect x="854" y="130" width="232" height="148" rx="12" fill="white" stroke="#bb7211" stroke-opacity=".4"/><rect x="870" y="146" width="34" height="34" rx="9" fill="#bb7211" fill-opacity=".1"/><text x="887" y="169" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#bb7211">4</text><text x="870" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#243650">output → Parent</text><text x="870" y="248" font-family="Arial,sans-serif" font-size="14" fill="#53677e">added.emit(total)</text><rect x="32" y="314" width="1056" height="80" rx="10" fill="#edf3fc"/><text x="52" y="341" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#005cca">ĐỌC → THỬ → ÁP DỤNG</text><text x="52" y="369" font-family="Arial,sans-serif" font-size="16" fill="#334d6f">Dữ liệu đi xuống, sự kiện đi lên; computed giữ giá trị dẫn xuất nhất quán.</text></svg>
