<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patterns · Tiêu chuẩn giao diện portal</title>
  <style>
    :root { color-scheme: light; --surface:#fff; --canvas:#f8f9fa; --text:#212121; --muted:#626b76; --line:#e6e6e6; --accent:#2962ff; --selected:#eff3ff; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--canvas); color:var(--text); }
    button,input,select { font:inherit; } button { cursor:pointer; } button:disabled { cursor:default; opacity:.5; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .lab-header { padding:16px 28px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brand { font-weight:700; font-size:16px; } .brand small { margin-left:12px; font-weight:400; font-size:12px; color:var(--muted); }
    .draft { color:#695118; background:#fff4d9; padding:4px 10px; border-radius:4px; font-size:12px; }
    nav { display:flex; gap:4px; padding:12px 28px 0; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    nav button { min-height:44px; padding:10px 16px; border:0; border-bottom:2px solid transparent; background:none; color:var(--muted); }
    nav button[aria-current="page"] { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    main { max-width:1480px; margin:auto; padding:26px 28px; } .page-heading { display:flex; justify-content:space-between; align-items:start; gap:20px; margin-bottom:22px; }
    h1 { font-size:22px; line-height:1.3; font-weight:650; margin:4px 0 6px; } h2 { font-size:16px; margin:0; } h3 { font-size:14px; margin:0; } p { margin:0; }
    .eyebrow,.muted { color:var(--muted); } .eyebrow { font-size:12px; } .sub { font-size:13px; color:var(--muted); }
    .button { border:1px solid var(--line); background:var(--surface); color:var(--text); padding:9px 13px; border-radius:6px; min-height:44px; }
    .button.primary { background:var(--accent); color:white; border-color:var(--accent); } .link { color:var(--accent); background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:3px; text-align:left; }
    .heading-actions { display:flex; align-items:center; gap:10px; } .heading-actions label { display:flex; flex-direction:column; font-size:11px; color:var(--muted); }
    .heading-actions select { min-height:36px; } .scope { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:12px; color:var(--muted); }
    .scores { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .score { position:relative; text-align:left; padding:16px 18px; border:1px solid var(--line); border-radius:8px; background:var(--surface); min-width:0; color:inherit; }
    .score:hover { border-color:#9bb3fc; } .score[aria-pressed="true"] { border-color:var(--accent); background:var(--selected); box-shadow:inset 0 0 0 1px var(--accent); }
    .score .label { display:block; color:var(--muted); font-size:13px; } .score strong { display:block; font-size:30px; line-height:1.4; font-variant-numeric:tabular-nums; letter-spacing:-.6px; }
    .score .hint { display:block; font-size:12px; color:var(--muted); min-height:18px; } .score .mark { position:absolute; right:16px; top:14px; color:var(--accent); }
    .toolbar { display:flex; align-items:end; gap:12px; margin-bottom:12px; flex-wrap:wrap; } .field { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); }
    .search { flex:1; min-width:200px; } input,select { min-height:44px; padding:10px 12px; border:1px solid #ccd0d6; border-radius:6px; background:white; color:var(--text); }
    input[type="search"] { width:100%; } .chips { display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-height:36px; margin-bottom:10px; }
    .chip { background:var(--selected); border:1px solid #bfcffd; color:#2148b5; padding:5px 10px; border-radius:5px; min-height:36px; }
    .result-label { margin-left:auto; font-size:12px; color:var(--muted); } .surface { background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .table-wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; white-space:nowrap; } th { background:#f5f6f8; color:#59616c; font-size:12px; font-weight:600; text-align:left; }
    th,td { padding:14px 18px; border-bottom:1px solid var(--line); } td .sub { font-size:12px; margin-top:3px; } .number { text-align:right; font-variant-numeric:tabular-nums; }
    .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:4px; font-size:12px; background:#fff2dc; color:#82550c; white-space:nowrap; }
    .badge.active { background:#eaf0ff; color:#254fae; } .badge.done { background:#e8f4eb; color:#256638; } .dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
    .pager { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; padding:14px 18px; background:var(--surface); border-top:1px solid var(--line); font-size:12px; }
    .pager-controls { display:flex; align-items:center; gap:10px; } .pager .button { padding:7px 13px; } .pager select { padding:7px; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; } .record { border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:18px; }
    .record-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:18px; } .record-title { margin:7px 0 4px; font-size:15px; font-weight:600; }
    .record .facts { display:flex; justify-content:space-between; gap:8px; margin:20px 0; padding-top:14px; border-top:1px solid var(--line); } .record .facts strong { display:block; }
    .record-foot { display:flex; justify-content:space-between; align-items:center; gap:10px; } .avatar { display:inline-grid; place-items:center; height:28px; width:28px; border-radius:50%; background:#edf0f4; font-size:11px; font-weight:600; }
    .board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; } .column { padding:12px; border:1px solid var(--line); border-radius:8px; background:#f0f2f5; }
    .column-header { display:flex; justify-content:space-between; align-items:center; padding:4px 4px 12px; } .column .record { margin-bottom:10px; padding:14px; } .column .record:last-child { margin:0; }
    .column .record-title { font-size:14px; } .column .button { margin-top:12px; width:100%; font-size:12px; }
    .overview-grid { display:grid; grid-template-columns:1.2fr 1fr; gap:18px; } .panel { padding:22px; } .panel h2 { margin-bottom:4px; } .breakdown { margin-top:22px; }
    .bar-row { width:100%; display:grid; grid-template-columns:110px 1fr 35px; gap:12px; align-items:center; text-align:left; border:0; background:transparent; padding:14px 0; color:inherit; }
    .track { height:10px; border-radius:3px; background:#edf0f4; overflow:hidden; } .bar { height:100%; background:#738fdf; } .bar.pending { background:#dca041; } .bar.done { background:#59a06e; }
    .attention { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:15px 0; border-bottom:1px solid var(--line); } .attention:last-child { border:0; }
    .notes { margin-top:22px; padding:16px 18px; border-left:3px solid #bfcffd; background:#f0f3fa; color:#495365; font-size:13px; } .notes strong { color:var(--text); }
    .state { text-align:center; padding:64px 20px; background:white; border:1px solid var(--line); border-radius:8px; min-height:300px; } .state h2 { margin:14px 0 8px; } .state .button { margin-top:20px; }
    .status { min-height:24px; color:#256638; font-size:13px; margin:8px 0; } dialog { width:min(560px,calc(100% - 32px)); padding:0; border:1px solid var(--line); border-radius:8px; color:var(--text); }
    dialog::backdrop { background:#18202b66; } .dialog-head,.dialog-foot { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line); } .dialog-foot { border-top:1px solid var(--line); border-bottom:0; }
    .dialog-body { padding:22px; } .dialog-body dl { display:grid; grid-template-columns:120px 1fr; gap:16px; } dt { color:var(--muted); } dd { margin:0; font-weight:500; }
    [hidden] { display:none!important; } @media(max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .scores { grid-template-columns:repeat(2,minmax(0,1fr)); } .overview-grid { grid-template-columns:1fr; } .board { grid-template-columns:1fr; } }
    @media(max-width:600px) { .lab-header,main { padding:16px; } .lab-header { align-items:start; } .brand small { display:block; margin:2px 0; } nav { padding:4px 8px 0; } nav button { padding:10px; flex:1 0 40%; } .page-heading { flex-direction:column; gap:12px; } .heading-actions { width:100%; justify-content:space-between; } h1 { font-size:20px; } .score { padding:13px; } .score strong { font-size:26px; } .scope { flex-direction:column; gap:3px; } .toolbar .search { flex-basis:100%; } .toolbar .field:not(.search) { flex:1; min-width:0; } input,select { font-size:16px; min-width:0; } .grid { grid-template-columns:1fr; } .result-label { margin:0; flex-basis:100%; } .pager-controls { flex-wrap:wrap; } .panel { padding:16px; } .bar-row { grid-template-columns:96px 1fr 28px; } .dialog-body dl { grid-template-columns:1fr; gap:6px; } dd { margin-bottom:10px; } .dialog-foot { padding-bottom:max(18px,env(safe-area-inset-bottom)); } }
    @media(max-width:359px) { .scores { grid-template-columns:1fr; } } @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <header class="lab-header"><div class="brand">portal-template <small>Thư viện page mẫu cho dev</small></div><span class="draft">Wireframe tương tác · Chờ duyệt</span></header>
  <nav id="pattern-nav" aria-label="Nhóm patterns"></nav>
  <main id="pattern-main"></main>
  <nav id="composition-nav" aria-label="Chọn page mẫu" hidden><button data-view="list" aria-current="page">Listing + Score card</button><button data-view="grid">Danh sách dạng card</button><button data-view="queue">Hàng đợi xử lý</button><button data-view="overview">Tổng quan vận hành</button></nav>
  <main id="composition-main" hidden data-story="IP" data-ac="IP-01 IP-02 IP-03 IP-04 IP-05 IP-06 IP-07 IP-09">
    <div class="page-heading"><div><p class="eyebrow" id="breadcrumb">Pages / Listing</p><h1 id="title">Quản lý đơn hàng</h1><p class="sub" id="subtitle">Từ tổng quan đến đúng đơn hàng cần xử lý.</p></div><div class="heading-actions"><label>Trạng thái demo<select id="state" aria-label="Trạng thái demo"><option value="data">Có dữ liệu</option><option value="loading">Đang tải</option><option value="empty">Chưa có dữ liệu</option><option value="error">Lỗi tải dữ liệu</option><option value="denied">Không có quyền</option></select></label><button class="button" id="reset-data">Khôi phục dữ liệu</button></div></div>
    <div class="scope"><span id="scope">Thống kê toàn bộ 24 đơn hàng mẫu</span><span>Click card để chọn nhanh tập bản ghi</span></div>
    <section class="scores" id="scores" aria-label="Thống kê và lọc đơn hàng"></section>
    <section id="query-region" aria-label="Bộ lọc đơn hàng"><div class="toolbar"><label class="field search">Tìm nhanh<input id="search" type="search" placeholder="Tìm mã đơn, tên khách hàng…" autocomplete="off"></label><label class="field">Khu vực<select id="region"><option value="">Tất cả khu vực</option><option>Miền Bắc</option><option>Miền Trung</option><option>Miền Nam</option></select></label><label class="field" id="sort-field">Sắp xếp<select id="sort"><option value="code">Mã đơn tăng dần</option><option value="amount-desc">Giá trị giảm dần</option><option value="amount-asc">Giá trị tăng dần</option></select></label><button class="button" id="clear">Xóa bộ lọc</button></div><div class="chips" id="chips"></div></section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="results" aria-label="Kết quả" aria-live="polite"></section>
    <aside class="notes" id="notes"></aside>
  </main>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><div><p class="eyebrow">Thông tin đơn hàng</p><h2 id="detail-title"></h2></div><button class="button" id="close-detail" aria-label="Đóng chi tiết">Đóng</button></div><div class="dialog-body" id="detail-body"></div><div class="dialog-foot"><span class="sub">Dữ liệu tổng hợp phục vụ tham khảo</span><button class="button primary" id="detail-done">Quay lại</button></div></dialog>
  <script>
    // Editable interaction wireframe. Production implementation will reuse Angular/Core UI.
    const labels={pending:'Chờ xử lý',active:'Đang xử lý',done:'Hoàn tất'};
    const clients=['An Phát','Minh Long','Bình Minh','Đại Việt','Hải Nam','Phú Gia','Thiên An','Trường Sơn'];
    const regions=['Miền Bắc','Miền Trung','Miền Nam'];
    const seed=()=>Array.from({length:24},(_,i)=>({id:i+1,code:'DH-'+String(1001+i),name:clients[i%8],region:regions[Math.floor(i/3)%3],status:['pending','active','done'][i%3],amount:(i+2)*1750000,owner:['Lan','Minh','Hà','Nam'][i%4]}));
    let records=seed(),view='list',selected='',query='',region='',sort='code',page=0,pageSize=6,loadState='data',opener=null;
    const $=id=>document.getElementById(id);
    const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=value=>new Intl.NumberFormat('vi-VN').format(value)+' ₫';
    const normalize=value=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().trim();
    const badge=status=>`<span class="badge ${status}"><span class="dot" aria-hidden="true"></span>${labels[status]}</span>`;
    const all=()=>loadState==='empty'?[]:records;
    const filtered=()=>all().filter(r=>(!selected||r.status===selected)&&(!region||r.region===region)&&normalize(r.code+' '+r.name).includes(normalize(query))).sort((a,b)=>(sort==='amount-desc'?b.amount-a.amount:sort==='amount-asc'?a.amount-b.amount:0)||a.id-b.id);
    function renderScores(){
      const data=all(),unavailable=['loading','error','denied'].includes(loadState),count=status=>data.filter(r=>r.status===status).length;
      $('scope').textContent=unavailable?'Thống kê chưa khả dụng':'Thống kê toàn bộ '+data.length+' đơn hàng mẫu · Không đổi theo bộ lọc';
      const cards=view==='overview'?[{label:'Tổng giá trị đơn hàng',value:money(data.reduce((s,r)=>s+r.amount,0)),hint:'Toàn bộ đơn hàng mẫu',metric:true},{label:'Chờ xử lý',value:count('pending'),key:'pending',hint:'Mở danh sách cần xử lý'},{label:'Đang xử lý',value:count('active'),key:'active',hint:'Mở danh sách đang xử lý'},{label:'Tỷ lệ hoàn tất',value:(data.length?Math.round(count('done')/data.length*100):0)+'%',hint:count('done')+'/'+data.length+' đơn hàng',metric:true}]:[{label:'Tất cả đơn hàng',value:data.length,key:'',hint:'Toàn bộ dữ liệu mẫu'},...Object.keys(labels).map(key=>({label:labels[key],value:count(key),key,hint:'Lọc theo trạng thái'}))];
      $('scores').innerHTML=cards.map(c=>{const active=!c.metric&&view!=='overview'&&selected===c.key;return `<${c.metric?'div':'button'} class="score" ${c.metric?'':`data-filter="${c.key}" aria-pressed="${active}" ${unavailable?'disabled':''}`}><span class="label">${c.label}</span><strong style="${c.metric&&c.label.includes('giá trị')?'font-size:22px':''}">${unavailable?'—':c.value}</strong><span class="hint">${active?'Đang lọc':c.hint}</span>${active?'<span class="mark" aria-hidden="true">✓</span>':''}</${c.metric?'div':'button'}>`}).join('');
    }
    function renderChips(total){$('chips').innerHTML=[selected?`<button class="chip" data-clear="status" aria-label="Xóa lọc trạng thái">${labels[selected]} ×</button>`:'',query?`<button class="chip" data-clear="search" aria-label="Xóa từ tìm kiếm">Tìm: ${esc(query)} ×</button>`:'',region?`<button class="chip" data-clear="region" aria-label="Xóa lọc khu vực">${region} ×</button>`:'',`<span class="result-label">${total} kết quả phù hợp / ${all().length} đơn hàng</span>`].join('');}
    function pager(total){return `<div class="pager"><span>${total? page*pageSize+1:0}–${Math.min((page+1)*pageSize,total)} / ${total} kết quả</span><div class="pager-controls"><label>Số dòng <select id="page-size">${[6,12,24].map(n=>`<option ${pageSize===n?'selected':''}>${n}</option>`).join('')}</select></label><button class="button" data-page="-1" ${!page?'disabled':''} aria-label="Trang trước">←</button><span>Trang ${page+1} / ${Math.max(1,Math.ceil(total/pageSize))}</span><button class="button" data-page="1" ${(page+1)*pageSize>=total?'disabled':''} aria-label="Trang sau">→</button></div></div>`;}
    function renderTable(data){const slice=data.slice(page*pageSize,(page+1)*pageSize);return `<div class="surface"><div class="table-wrap" tabindex="0" role="region" aria-label="Bảng đơn hàng, cuộn ngang trên màn hình nhỏ"><table><thead><tr><th scope="col">Mã đơn</th><th scope="col">Khách hàng</th><th scope="col">Khu vực</th><th scope="col">Trạng thái</th><th scope="col" class="number">Giá trị đơn hàng</th><th scope="col">Phụ trách</th></tr></thead><tbody>${slice.map(r=>`<tr><td><button class="link" data-open="${r.id}">${r.code}</button></td><td><strong>${r.name}</strong><p class="sub">Đơn cung ứng thiết bị · ${r.id+2} sản phẩm</p></td><td>${r.region}</td><td>${badge(r.status)}</td><td class="number">${money(r.amount)}</td><td>${r.owner}</td></tr>`).join('')}</tbody></table></div>${pager(data.length)}</div>`;}
    function renderGrid(data){return `<div class="grid">${data.slice(page*pageSize,(page+1)*pageSize).map(r=>`<article class="record"><div class="record-top"><span class="eyebrow">${r.code}</span>${badge(r.status)}</div><h2 class="record-title">${r.name}</h2><p class="sub">${r.region} · Cung ứng thiết bị</p><div class="facts"><div><span class="sub">Giá trị đơn hàng</span><strong>${money(r.amount)}</strong></div><div><span class="sub">Sản phẩm</span><strong>${r.id+2}</strong></div></div><div class="record-foot"><span><span class="avatar" aria-hidden="true">${r.owner[0]}</span> ${r.owner}</span><button class="link" data-open="${r.id}" aria-label="Xem đơn ${r.code}">Xem đơn hàng →</button></div></article>`).join('')}</div>${pager(data.length)}`;}
    function renderQueue(data){return `<div class="board">${Object.keys(labels).map(status=>{const rows=data.filter(r=>r.status===status);return `<section class="column" aria-label="${labels[status]}"><div class="column-header"><h2>${labels[status]}</h2><span class="badge ${status}">${rows.length}</span></div>${rows.map(r=>`<article class="record"><button class="link" data-open="${r.id}">${r.code}</button><h3 class="record-title">${r.name}</h3><p class="sub">${r.region} · ${r.owner}</p><strong>${money(r.amount)}</strong>${status!=='done'?`<button class="button" data-transition="${r.id}">${status==='pending'?'Đưa vào xử lý':'Đánh dấu hoàn tất'} →</button>`:'<p class="sub" style="margin-top:12px">✓ Đã hoàn tất</p>'}</article>`).join('')||'<p class="sub">Không có đơn trong giai đoạn này.</p>'}</section>`}).join('')}</div>`;}
    function renderOverview(){const data=all();return `<div class="overview-grid"><section class="surface panel"><h2>Phân bố theo trạng thái</h2><p class="sub">Số đơn trên toàn bộ dữ liệu mẫu · Click để xem danh sách</p><div class="breakdown">${Object.keys(labels).map(status=>{const count=data.filter(r=>r.status===status).length;return `<button class="bar-row" data-filter="${status}" aria-label="Xem ${labels[status]}"><span>${labels[status]}</span><span class="track"><span class="bar ${status}" style="display:block;width:${data.length?count/data.length*100:0}%"></span></span><strong class="number">${count}</strong></button>`}).join('')}</div></section><section class="surface panel"><h2>Cần xử lý trước</h2><p class="sub">4 đơn chờ xử lý có giá trị cao nhất</p>${data.filter(r=>r.status==='pending').sort((a,b)=>b.amount-a.amount).slice(0,4).map(r=>`<div class="attention"><div><button class="link" data-open="${r.id}">${r.code} · ${r.name}</button><p class="sub">${r.region} · ${r.owner}</p></div><strong class="number">${money(r.amount)}</strong></div>`).join('')}</section></div>`;}
    function render(){
      const headings={list:['Pages / Listing','Quản lý đơn hàng','Từ tổng quan đến đúng đơn hàng cần xử lý.'],grid:['Pages / Card grid','Đơn hàng theo khách hàng','Duyệt hồ sơ bằng thẻ, ưu tiên nhận diện và thông tin ngắn.'],queue:['Pages / Work queue','Hàng đợi xử lý','Theo dõi luồng công việc và chuyển bước ngay tại mỗi đơn.'],overview:['Pages / Overview','Tổng quan vận hành','Đọc chỉ số, xác định ưu tiên và mở đúng danh sách.']};
      const notes={list:'<strong>Mẫu 01 · So sánh theo cột.</strong> Score card là bộ lọc một lựa chọn; search và khu vực kết hợp AND. Thống kê giữ toàn cảnh. Đổi lọc về trang đầu. Mở chi tiết không mất query.',grid:'<strong>Mẫu 02 · Nhận diện bằng card.</strong> Dùng khi metadata ngắn và người dùng cần duyệt từng hồ sơ. Tránh dùng khi phải so sánh nhiều chỉ số theo cột. Dữ liệu wireframe giống listing để so sánh bố cục.',queue:'<strong>Mẫu 03 · Làm việc theo giai đoạn.</strong> Thao tác chuyển bước có nút rõ ràng; không phụ thuộc kéo thả. Count, cột và tổng quan cùng cập nhật từ một bộ dữ liệu.',overview:'<strong>Mẫu 04 · Từ chỉ số tới hành động.</strong> Card tổng tiền và tỷ lệ là metric chỉ đọc; card trạng thái và thanh phân bố mở listing đúng bộ lọc. Không hiển thị xu hướng khi thiếu dữ liệu kỳ trước.'};
      ['breadcrumb','title','subtitle'].forEach((id,i)=>$(id).textContent=headings[view][i]);$('notes').innerHTML=notes[view];
      document.querySelectorAll('#composition-nav button').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.view===view)b.setAttribute('aria-current','page');});
      $('query-region').hidden=view==='overview';$('sort-field').hidden=view==='queue';renderScores();
      const data=filtered();page=Math.min(page,Math.max(0,Math.ceil(data.length/pageSize)-1));renderChips(data.length);
      $('results').setAttribute('aria-busy',String(loadState==='loading'));
      if(loadState!=='data'){const states={loading:['Đang tải dữ liệu','Vui lòng đợi. Chuyển trạng thái demo để xem kết quả.'],empty:['Chưa có dữ liệu mẫu','Khôi phục dữ liệu để bắt đầu thử các mẫu.'],error:['Không thể tải đơn hàng','Bộ lọc của bạn vẫn được giữ lại. Hãy thử lại.'],denied:['Bạn không có quyền xem dữ liệu','Liên hệ người quản trị để được cấp quyền phù hợp.']};const [title,description]=states[loadState];$('results').innerHTML=`<div class="state"><h2>${title}</h2><p class="sub">${description}</p>${loadState==='error'?'<button class="button primary" data-retry>Thử lại</button>':loadState==='empty'?'<button class="button" data-reset>Khôi phục dữ liệu</button>':''}</div>`;return;}
      if(!data.length&&view!=='overview'){$('results').innerHTML='<div class="state"><h2>Không có kết quả phù hợp</h2><p class="sub">Thử từ khóa khác hoặc xóa bộ lọc để xem toàn bộ đơn hàng.</p><button class="button" data-clear-all>Xóa bộ lọc</button></div>';return;}
      $('results').innerHTML=view==='list'?renderTable(data):view==='grid'?renderGrid(data):view==='queue'?renderQueue(data):renderOverview();
    }
    function clear(){selected='';query='';region='';sort='code';page=0;$('search').value='';$('region').value='';$('sort').value='code';render();}
    function reset(){records=seed();loadState='data';$('state').value='data';$('status').textContent='Đã khôi phục 24 đơn hàng mẫu.';clear();}
    function openDetail(id,button){const r=records.find(r=>r.id===id);if(!r)return;opener=button;$('detail-title').textContent=r.code+' · '+r.name;$('detail-body').innerHTML=`${badge(r.status)}<dl><dt>Khách hàng</dt><dd>${r.name}</dd><dt>Khu vực</dt><dd>${r.region}</dd><dt>Giá trị</dt><dd>${money(r.amount)}</dd><dt>Phụ trách</dt><dd>${r.owner}</dd></dl><p class="sub">Chi tiết đọc để duyệt bố cục. Form create/update sẽ tái sử dụng page Angular hiện có khi tích hợp.</p>`;$('detail').showModal();}
    $('detail').addEventListener('close',()=>opener?.focus());['close-detail','detail-done'].forEach(id=>$(id).addEventListener('click',()=>$('detail').close()));
    document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;
      if(button.hasAttribute('data-view')){view=button.dataset.view;page=0;$('status').textContent='';render();}
      if(button.hasAttribute('data-filter')){const status=button.dataset.filter;if(view==='overview'){view='list';query='';region='';$('search').value='';$('region').value='';selected=status;}else selected=selected===status?'':status;page=0;render();}
      if(button.hasAttribute('data-page')){page+=Number(button.dataset.page);render();}
      if(button.hasAttribute('data-open'))openDetail(Number(button.dataset.open),button);
      if(button.hasAttribute('data-transition')){const row=records.find(r=>r.id===Number(button.dataset.transition));if(row&&row.status!=='done'){row.status=row.status==='pending'?'active':'done';render();$('status').textContent=row.code+' đã chuyển sang '+labels[row.status].toLowerCase()+'.';$('status').tabIndex=-1;$('status').focus();}}
      if(button.hasAttribute('data-clear')){const key=button.dataset.clear;if(key==='status')selected='';if(key==='search'){query='';$('search').value='';}if(key==='region'){region='';$('region').value='';}page=0;render();$('search').focus();}
      if(button.hasAttribute('data-clear-all'))clear();if(button.hasAttribute('data-retry')){loadState='data';$('state').value='data';render();}if(button.hasAttribute('data-reset'))reset();
    });
    $('search').addEventListener('input',event=>{query=event.target.value;page=0;render();});$('region').addEventListener('change',event=>{region=event.target.value;page=0;render();});$('sort').addEventListener('change',event=>{sort=event.target.value;page=0;render();});
    $('state').addEventListener('change',event=>{loadState=event.target.value;render();});document.addEventListener('change',event=>{if(event.target.id==='page-size'){pageSize=Number(event.target.value);page=0;render();}});
    $('clear').addEventListener('click',clear);$('reset-data').addEventListener('click',reset);render();
  </script>

    function scorecardIcon(name,classes=''){
      const shapes={orders:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 7h6M9 11h6M9 15h3"/>',customers:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5v1"/>',amount:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 15h3"/>',pending:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',active:'<path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-3l2 2M4 17l2 2a8 8 0 0 0 13-3"/>',done:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'};
      return `<span class="score-symbol ${classes}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">${shapes[name]||shapes.orders}</svg></span>`;

    function iconScoreRows(status=''){

    function iconScoreSpecimen(){

    function drawLibrary(){

    function sampleHeader(){const detail=['detail','status'].includes(variant);return `<header class="specimen-header"><div><div class="title-line">${detail?'<button class="button back" data-preview-message="Quay lại danh sách và giữ query hiện tại." aria-label="Quay lại danh sách">←</button>':''}<h2>${detail?'Đơn hàng #DH-1024':variant==='editing'?'Tạo đơn hàng':'Quản lý đơn hàng'}</h2>${variant==='status'?badge('pending'):''}</div>${['description','detail','status'].includes(variant)?'<p class="sub">'+(detail?'Công ty An Phát · Miền Bắc':'Theo dõi đơn hàng, trạng thái xử lý và thông tin giao nhận.')+'</p>':''}</div>${variant==='actions'?'<div class="actions"><button class="button" data-preview-message="Vị trí hành động Xuất danh sách.">Xuất danh sách</button><button class="button primary" data-open-contact="create">Tạo đơn hàng</button></div>':variant==='editing'?'<div class="actions"><button class="button" data-preview-message="Hủy nhập và kiểm tra dữ liệu chưa lưu.">Hủy</button><button class="button primary" data-preview-message="Tạo đơn hàng sau khi form hợp lệ.">Tạo đơn hàng</button></div>':''}</header>`;}
    function sampleFields(prefill=false){const c=prefill?savedContact:{name:'',email:'',phone:'',region:'Miền Bắc'};return `<label>Họ và tên *<input name="name" required maxlength="100" autocomplete="off" value="${esc(c.name)}" placeholder="Nhập họ và tên"></label><label>Email *<input name="email" type="email" required value="${esc(c.email)}" placeholder="ten@example.test"></label><label>Số điện thoại<input name="phone" value="${esc(c.phone)}" inputmode="tel"></label><label>Khu vực<select name="region">${regions.map(r=>`<option ${c.region===r?'selected':''}>${r}</option>`).join('')}</select></label>`;}

    function specimen(){

hách hàng</th><th>Trạng thái</th><th class="number">Giá trị</th></tr></thead><tbody id="sample-rows">${records.slice(0,4).map(r=>`<tr data-search-text="${r.code} ${r.name}">${variant==='selection'?'<td><input type="checkbox" data-row-check aria-label="Chọn '+r.code+'"></td>':''}<td><button class="link" data-open="${r.id}">${r.code}</button></td><td>${r.name}</td><td>${badge(r.status)}</td><td class="number">${money(r.amount)}</td></tr>`).join('')}</tbody></table><p id="table-no-results" hidden style="padding:20px">Không có kết quả phù hợp.</p></div><p class="sub" style="margin-top:12px">4 dòng minh họa · Mở Ghép thành page để thử phân trang và bộ lọc kết hợp.</p>`;
      if(group==='scores')return variant==='filter'?`<div class="scores">${['','pending','active','done'].map(s=>`<button class="score" data-score-choice="${s}" aria-pressed="${s===''}"><span class="label">${labels[s]||'Tất cả'}</span><strong>${s?8:24}</strong><span class="hint">${s?'Chọn để lọc':'Đang chọn'}</span></button>`).join('')}</div><p id="score-feedback" role="status" style="margin-top:14px">Đang xem toàn bộ 24 đơn hàng. Thử luồng đầy đủ trong Ghép thành page.</p>`:variant==='progress'?'<div class="score" style="max-width:360px"><span class="label">Tiến độ hoàn tất</span><strong>62%</strong><div class="mini-progress" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="Tiến độ hoàn tất"><span></span></div><span class="hint">31 / 50 yêu cầu đã hoàn tất</span></div>':variant==='comparison'?'<div class="score" style="max-width:360px"><span class="label">Đơn hàng trong tháng 9</span><strong>120</strong><span class="hint">Tháng 8: 100 đơn · Chênh lệch +20%</span></div>':variant==='compact'?'<div class="surface" style="display:flex;gap:24px;padding:18px;flex-wrap:wrap"><span>Chờ xử lý <strong>8</strong></span><span>Đang xử lý <strong>8</strong></span><span>Hoàn tất <strong>8</strong></span></div>':'<div class="score" style="max-width:360px"><span class="label">Tổng giá trị đơn hàng</span><strong style="font-size:25px">567.000.000 ₫</strong><span class="hint">24 đơn hàng · Toàn bộ dữ liệu mẫu</span></div>';
      if(group==='buttons'){const rows=variant==='crud'?[['Tạo liên hệ','create','Primary khi tạo mới'],['Lưu thay đổi','update','Primary khi chỉnh sửa'],['Chỉnh sửa','update','Chuyển từ detail sang update'],['Đóng','message','Rời detail; không ghi dữ liệu']]:variant==='query'?[['Tìm kiếm','message','Dùng cho search có submit'],['Áp dụng bộ lọc','message','Dùng khi có filter draft'],['Xóa bộ lọc','message','Đưa query về mặc định']]:variant==='workflow'?[['Gửi duyệt','message','Chuyển sang bước phê duyệt'],['Duyệt đơn hàng','message','Áp dụng kết quả duyệt'],['Từ chối','message','Kèm lý do khi nghiệp vụ yêu cầu']]:variant==='danger'?[['Xóa đơn hàng','danger','Có bước xác nhận và đối tượng rõ']]:[['Lưu thay đổi','async','Thử pending → lỗi → retry']];return rows.map(([label,action,hint])=>`<div class="button-spec"><div class="description"><strong>${label}</strong><p class="sub">${hint}</p></div><button class="button ${action==='message'?'':'primary'}" ${action==='create'||action==='update'?`data-open-contact="${action}"`:`data-button-demo="${action}"`}>${label}</button></div>`).join('')+'<div id="button-result" role="status" style="margin-top:14px"></div>';}
      if(group==='forms'){if(variant==='readonly')return `<div class="sample-form"><h2>Thông tin liên hệ</h2>${facts()}<div class="form-footer"><button class="button primary" data-open-contact="update">Chỉnh sửa</button></div></div>`;return `<form class="sample-form" id="page-sample-form"><div class="helper-controls"><label><input id="simulate-save-error" type="checkbox"> Mô phỏng lỗi lưu</label></div>${variant==='sections'?'<fieldset class="form-section"><legend>Thông tin liên hệ</legend><p class="sub">Đầu mối chính để phối hợp công việc.</p><div class="sample-fields">'+sampleFields()+'</div></fieldset><fieldset class="form-section"><legend>Thông tin bổ sung</legend><label class="field">Ghi chú<input name="note" placeholder="Nội dung phối hợp"></label></fieldset>':variant==='lines'?'<label class="field" style="margin-bottom:18px">Tên đơn hàng *<input name="orderName" required placeholder="Đơn hàng tháng 9"></label><div id="line-rows"></div><button class="button" type="button" id="add-line">Thêm dòng hàng</button><p style="margin-top:12px">Tổng cộng: <strong id="line-total">0 ₫</strong></p>':`<div class="sample-fields ${variant==='simple'?'one':''}">${sampleFields()}</div>`}<p id="form-result" role="status" class="error-text"></p><div class="form-footer"><button class="button" type="reset">Nhập lại</button><button class="button primary" type="submit">${variant==='lines'?'Tạo đơn hàng':'Tạo liên hệ'}</button></div></form>`;}
      return `<div class="sample-form"><h2>${variant==='detail'?'Xem liên hệ trong drawer':variant==='update'?'Chỉnh sửa liên hệ':variant==='sections'?'Chỉnh sửa theo nhóm':'Tạo liên hệ'}</h2><p class="sub" style="margin:10px 0 20px">Danh sách vẫn giữ nguyên ở phía sau. Header/body/footer được tách rõ trong cùng một drawer.</p><button class="button primary" data-open-contact="${variant}">Mở side drawer</button><p class="sub" style="margin-top:16px">Thử nhập thông tin rồi bấm Đóng hoặc Escape để kiểm tra dữ liệu chưa lưu.</p></div>`;
    }
    function setupTable(){if(variant==='selection'){const update=()=>{const boxes=[...document.querySelectorAll('[data-row-check]')],n=boxes.filter(b=>b.checked).length;$('selected-count').textContent='Đã chọn '+n+' đơn';$('bulk-approve').disabled=!n;$('select-all').checked=n===boxes.length;$('select-all').indeterminate=n>0&&n<boxes.length;};$('select-all').onchange=()=>{document.querySelectorAll('[data-row-check]').forEach(b=>b.checked=$('select-all').checked);update();};document.querySelectorAll('[data-row-check]').forEach(b=>b.onchange=update);$('bulk-approve').onclick=()=>{document.querySelectorAll('[data-row-check]:checked').forEach(b=>{b.closest('tr').querySelector('.badge').outerHTML=badge('active');b.checked=false;});$('pattern-message').textContent='Đã duyệt các dòng được chọn trong bảng minh họa.';update();};}}
    function drawerValues(){const form=$('drawer-form');return form?Object.fromEntries(new FormData(form)):{...drawerSeed};}

    function openContact(mode,button){drawerMode=mode;drawerOpener=button||drawerOpener;drawerPending=false;const create=['create','dirty'].includes(mode);drawerSeed=create?{name:'',email:'',phone:'',region:'Miền Bắc'}:{...savedContact};
      $('pattern-drawer').innerHTML=`<div class="drawer-frame"><div class="dialog-head"><div><p class="eyebrow">${create?'Tạo mới':mode==='detail'?'Chi tiết liên hệ':'Chỉnh sửa'}</p><h2 id="drawer-title">${create?'Tạo liên hệ':esc(savedContact.name)}</h2></div><button class="button" id="drawer-close">Đóng</button></div><div class="drawer-scroll">${mode==='detail'?facts():`<form id="drawer-form" class="sample-form"><div class="sample-fields one">${sampleFields(!create)}</div>${mode==='sections'?'<fieldset class="form-section" style="margin-top:24px"><legend>Ghi chú phối hợp</legend><p class="sub">Giữ phần mở rộng ngắn; hồ sơ nhiều tab nên dùng full page.</p></fieldset>':''}<div class="helper-controls" style="margin-top:20px"><label><input type="checkbox" id="drawer-error"> Mô phỏng lỗi lưu</label></div><p class="error-text" id="drawer-result" role="status"></p></form>`}<div id="drawer-unsaved" class="unsaved" hidden><h3>Thông tin chưa được lưu</h3><p>Bỏ thay đổi sẽ mất nội dung vừa nhập.</p><div class="actions"><button class="button" id="discard-draft">Bỏ thay đổi</button><button class="button primary" id="keep-editing">Tiếp tục chỉnh sửa</button></div></div></div><div class="dialog-foot"><span class="sub">${mode==='detail'?'Thông tin đã lưu':'* Trường bắt buộc'}</span><div class="actions">${mode==='detail'?'<button class="button primary" id="drawer-edit">Chỉnh sửa</button>':`<button class="button" id="drawer-cancel">Hủy</button><button class="button primary" type="submit" form="drawer-form" id="drawer-save">${create?'Tạo liên hệ':'Lưu thay đổi'}</button>`}</div></div></div>`;
      $('drawer-close').onclick=closeDrawer;if($('drawer-cancel'))$('drawer-cancel').onclick=closeDrawer;$('discard-draft').onclick=()=>$('pattern-drawer').close();$('keep-editing').onclick=()=>{$('drawer-unsaved').hidden=true;$('drawer-form').elements.namedItem('name').focus();};if($('drawer-edit'))$('drawer-edit').onclick=()=>openContact('update');
      if($('drawer-form'))$('drawer-form').onsubmit=async event=>{event.preventDefault();if(drawerPending)return;drawerPending=true;const shouldFail=$('drawer-error').checked,value=drawerValues();$('drawer-save').disabled=true;$('drawer-save').textContent='Đang lưu…';$('drawer-close').disabled=true;$('drawer-cancel').disabled=true;$('drawer-form').querySelectorAll('input,select').forEach(el=>el.disabled=true);await new Promise(resolve=>setTimeout(resolve,500));drawerPending=false;if(shouldFail){$('drawer-form').querySelectorAll('input,select').forEach(el=>el.disabled=false);$('drawer-result').textContent='Không thể lưu. Dữ liệu đã nhập được giữ lại; bỏ chọn mô phỏng lỗi và thử lại.';$('drawer-save').disabled=false;$('drawer-save').textContent=create?'Tạo liên hệ':'Lưu thay đổi';$('drawer-close').disabled=false;$('drawer-cancel').disabled=false;return;}savedContact=value;$('pattern-drawer').close();if($('pattern-message'))$('pattern-message').textContent='Đã lưu liên hệ '+value.name+' trong phiên demo.';};

      if(b.dataset.previewMessage)$('pattern-message').textContent=b.dataset.previewMessage;
      if(b.hasAttribute('data-copy-source')){try{await navigator.clipboard.writeText($('pattern-source').textContent);$('pattern-message').textContent='Đã sao chép markup của preview.';}catch{$('pattern-message').textContent='Không truy cập được clipboard. Chọn và sao chép trực tiếp trong khối source.';}}
      if(b.hasAttribute('data-score-choice')){const old=b.getAttribute('aria-pressed')==='true',key=old?'':b.dataset.scoreChoice;document.querySelectorAll('[data-score-choice]').forEach(el=>{const active=el.dataset.scoreChoice===key;el.setAttribute('aria-pressed',String(active));el.querySelector('.hint').textContent=active?'✓ Đang chọn':'Chọn để lọc';});if($('icon-filter-results'))$('icon-filter-results').innerHTML=iconScoreRows(key);else $('score-feedback').textContent=key?'Đang chọn '+labels[key].toLowerCase()+': 8 / 24 đơn hàng.':'Đang xem toàn bộ 24 đơn hàng.';}
      if(b.id==='tree-toggle'){const expanded=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(expanded));b.textContent=(expanded?'▾':'▸')+' Thiết bị văn phòng';document.querySelectorAll('[data-tree-child]').forEach(el=>el.hidden=!expanded);}
      if(b.id==='add-line')addLine();if(b.hasAttribute('data-remove-line')){b.closest('.sample-fields').remove();totalLines();}
      if(b.dataset.buttonDemo==='message')$('button-result').textContent='Nhãn và vị trí hành động: '+b.textContent+'.';
      if(b.dataset.buttonDemo==='danger')$('button-result').innerHTML='<div class="unsaved"><h3>Xóa đơn hàng DH-1024?</h3><p>Đơn hàng này sẽ bị xóa khỏi danh sách demo.</p><div class="actions"><button class="button" data-danger-cancel>Giữ lại</button><button class="button primary" data-danger-confirm>Xóa đơn hàng</button></div></div>';
      if(b.hasAttribute('data-danger-cancel'))$('button-result').textContent='Đã giữ lại đơn hàng.';if(b.hasAttribute('data-danger-confirm'))$('button-result').textContent='Đã xác nhận xóa trong mẫu câu chữ; không có bản ghi thật bị xóa.';
      if(b.dataset.buttonDemo==='async'){const generation=previewGeneration,retry=b.dataset.retry==='true';b.disabled=true;b.textContent='Đang lưu…';await new Promise(r=>setTimeout(r,500));if(generation!==previewGeneration)return;b.disabled=false;b.dataset.retry='true';b.textContent=retry?'Lưu thay đổi':'Thử lại';$('button-result').textContent=retry?'Đã lưu thay đổi.':'Không thể lưu. Dữ liệu được giữ nguyên; vui lòng thử lại.';}
    });
    document.addEventListener('input',event=>{if(event.target.id==='table-search'){let count=0;document.querySelectorAll('[data-search-text]').forEach(row=>{row.hidden=!normalize(row.dataset.searchText).includes(normalize(event.target.value));if(!row.hidden)count++;});$('table-no-results').hidden=count>0;}if(event.target.matches('[data-price],[data-quantity]'))totalLines();});
    document.addEventListener('change',event=>{if(event.target.id==='table-state'){const state=event.target.value,text={loading:'Đang tải đơn hàng…',empty:'Chưa có đơn hàng', 'no-results':'Không có kết quả phù hợp',error:'Không thể tải đơn hàng'};$('table-state-body').innerHTML='<h2>'+text[state]+'</h2><p class="sub">'+(state==='empty'?'Tạo đơn hàng đầu tiên để bắt đầu.':state==='no-results'?'Thử từ khóa khác hoặc xóa bộ lọc.':state==='error'?'Thử lại; các điều kiện tìm kiếm được giữ nguyên.':'Giữ khung bảng ổn định khi chờ kết quả.')+'</p>';}});
    document.addEventListener('submit',async event=>{if(event.target.id!=='page-sample-form')return;event.preventDefault();const form=event.target;if(variant==='lines'&&!$('line-rows').children.length){$('form-result').textContent='Thêm ít nhất một dòng hàng.';return;}const button=form.querySelector('[type="submit"]');if(button.disabled)return;const fail=$('simulate-save-error').checked;button.disabled=true;button.textContent='Đang lưu…';await new Promise(r=>setTimeout(r,500));if(!form.isConnected)return;button.disabled=false;button.textContent=variant==='lines'?'Tạo đơn hàng':'Tạo liên hệ';$('form-result').textContent=fail?'Không thể lưu. Nội dung đã nhập được giữ lại; bỏ chọn mô phỏng lỗi để thử lại.':'Đã lưu dữ liệu mẫu trong phiên xem trước.';});
    document.addEventListener('reset',event=>{if(event.target.id==='page-sample-form'){setTimeout(()=>{totalLines();$('form-result').textContent='';},0);}});
    const initialPattern=location.hash.slice(1).split('/');
    if(library[initialPattern[0]]&&library[initialPattern[0]].variants.some(v=>v[0]===initialPattern[1])){group=initialPattern[0];variant=initialPattern[1];}
    drawLibrary();
  </script>
</body>
</html>
