<sd-page [title]="'SdRadio Component'" [description]="pageDescription()">
  <div headerRight>
    <div class="d-flex gap-8"></div>
  </div>

  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <!-- CỘT TRÁI: CONFIGURATION -->
      <div class="col-md-4">
        <sd-section title="Thuộc tính" icon="settings"
          ><div class="demo-property-content">
            <div class="demo-config-panel">
              <app-demo-property label="label">
                <span propertyDescription>Tiêu đề hiển thị phía trên nhóm radio.</span>
                <sd-input [(model)]="label" hideInlineError size="sm"></sd-input
              ></app-demo-property>

              <app-demo-property label="display">
                <span propertyDescription>Layout option: ngang (row) hoặc dọc (column).</span>
                <sd-select
                  [items]="displayOptions"
                  valueField="id"
                  displayField="name"
                  [(model)]="display"
                  hideInlineError
                  size="sm"></sd-select
              ></app-demo-property>

              <app-demo-property label="color">
                <span propertyDescription>Bộ màu hệ thống áp dụng cho nút radio.</span>
                <sd-select
                  [items]="colorOptions"
                  valueField="id"
                  displayField="name"
                  [(model)]="color"
                  hideInlineError
                  size="sm"></sd-select
              ></app-demo-property>

              <app-demo-property label="disabled">
                <span propertyDescription>Khoá tương tác với toàn bộ nhóm radio.</span>
                <sd-switch [(model)]="disabled" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="required">
                <span propertyDescription>Đánh dấu trường bắt buộc chọn.</span>
                <sd-switch [(model)]="required" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="viewed">
                <span propertyDescription>Chuyển control sang chế độ hiển thị (read-only).</span>
                <sd-switch [(model)]="viewed" hideInlineError size="sm"></sd-switch
              ></app-demo-property>
            </div></div
        ></sd-section>
      </div>

      <!-- CỘT PHẢI: PREVIEW & CODE -->
      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Xem trước" icon="visibility"
            ><div class="demo-section-content">
              <div
                class="p-24 bg-slate-100 rounded-8 border border-dashed border-slate-300 d-flex align-items-center justify-content-center">
                <sd-radio
                  style="width: 100%"
                  [(model)]="modelValue"
                  [items]="genderItems"
                  valueField="id"
                  displayField="name"
                  [label]="label()"
                  [display]="display()"
                  [color]="color()"
                  [disabled]="disabled()"
                  [required]="required()"
                  [viewed]="viewed()">
                </sd-radio>
              </div>
              <div class="mt-16 font-size-13"><span class="T16M">Giá trị hiện tại:</span> {{ modelValue() }}</div>
            </div></sd-section
          >

          <sd-section title="Mã nguồn" icon="code"
            ><div class="demo-section-content">
              <h4 class="font-size-14 mb-8">HTML</h4>
              <sd-code-editor [model]="htmlCode()" language="html" maxHeight="300px" [viewed]="true"></sd-code-editor>
              <h4 class="font-size-14 mb-8 mt-16">Typescript</h4>
              <sd-code-editor [model]="tsCode" language="typescript" maxHeight="300px" [viewed]="true"></sd-code-editor></div
          ></sd-section>
        </div>
      </div>
    </div>
  </div>
</sd-page>
