<sd-page [noHeader]="inDrawer()" [title]="title()">
  <div headerLeft class="d-flex align-items-center gap-8">
    <sd-button tooltip="Quay lại" type="text" prefixIcon="arrow_back" [disabled]="store.saving()" (click)="cancel()" /><app-record-header
      [kind]="store.kind"
      [mode]="editing ? 'update' : 'create'"
      [entity]="current" />
  </div>
  <div headerRight class="record-actions">
    @if (!stale) {
      <sd-button
        title="Lưu"
        type="fill"
        color="primary"
        prefixIcon="save"
        [loading]="store.saving()"
        [disabled]="store.saving()"
        (click)="save()" />
    }
  </div>
  <div class="reference-form-compact p-20 d-flex flex-column gap-8">
    @if (stale) {
      <sd-data-state state="error" title="Hồ sơ không còn tồn tại" message="Quay lại danh sách và chọn một hồ sơ khác." />
    } @else {
      <app-entity-form-sections [form]="form" [seed]="seed" [extended]="false" [editing]="editing" />
      @if (saved()) {
        <p role="status" class="text-success">Đã lưu hồ sơ.</p>
      }
      @if (error()) {
        <div role="alert" tabindex="-1" class="p-16 bg-error-light text-error rounded-8" data-testid="form-error">{{ error() }}</div>
      }
    }
  </div></sd-page
>
