<div class="list-shell" [hidden]="view() === 'create'">
  <sd-page title="Danh sách yêu cầu hỗ trợ"
    ><sd-button headerRight title="Tạo mới" type="fill" color="primary" prefixIcon="add" (click)="create()" />
    <div class="list-content">
      <dl class="list-scorecards" aria-label="Thống kê toàn bộ yêu cầu">
        @for (card of scoreCards(); track card.label) {
          <div class="list-scorecard" [attr.data-tone]="card.tone">
            <dt>{{ card.label }}</dt>
            <dd>{{ card.value }}</dd>
          </div>
        }
      </dl>

      <div class="list-master-content">
        <div class="list-master-table">
          <sd-table autoId="list-master-detail" [option]="option()">
            <ng-template sdTableCellDef="code" let-row="item">
              <a [href]="navigation.href('detail', row.id)" class="record-link" (click)="navigation.openLink($event, row.id)">{{
                row.code
              }}</a>
            </ng-template>
          </sd-table>
        </div>
        <aside class="list-detail-panel" aria-label="Chi tiết yêu cầu">
          @if (view() === 'detail') {
            <app-detail-overview [embedded]="true" (done)="back()" />
          } @else {
            <sd-data-state state="empty" title="Chọn một yêu cầu" message="Mở hồ sơ từ danh sách để xem và cập nhật." />
          }
        </aside>
      </div></div
  ></sd-page>
</div>
@if (view() === 'create') {
  @if (store.kind === 'order') {
    <app-form-line-items [embedded]="true" (done)="back()" />
  } @else {
    <app-form-sections [embedded]="true" (done)="back()" />
  }
}
