<sd-page title="sd-query-bar — Cơ bản" [description]="pageDescription()">
  <div class="demo-page-body">

    <sd-section title="Component" icon="filter_alt" class="mb-16">
      <div class="action-row">
        <button type="button" class="btn-link" (click)="seedSample()">Seed 3 chip mẫu</button>
        <button type="button" class="btn-link btn-link--danger" (click)="clearAll()">Xoá hết</button>
        <span class="counter">apply: <strong>{{ applyCount() }}</strong> · gần nhất {{ lastApply() }}</span>
      </div>

      <sd-query-bar
        [fields]="fields"
        [(filters)]="filters"
        (apply)="onApply()">
      </sd-query-bar>

      <div class="tip mt-12">
        💡 Bấm <strong>"+ Thêm bộ lọc"</strong> để chọn field. Chip có icon theo `kind`. Click chip để mở popover sửa value. Nút search bên phải fire <code>(apply)</code>.
      </div>
    </sd-section>

    <sd-section title="filters() — model 2-way" icon="data_object" class="mb-16">
      <pre class="json">{{ filtersJson() }}</pre>
    </sd-section>

    <sd-section title="Mã nguồn" icon="code" class="mb-16">
      <sd-code-editor [model]="tsCode" language="typescript" maxHeight="520px" [viewed]="true"></sd-code-editor>
    </sd-section>

  </div>
</sd-page>
