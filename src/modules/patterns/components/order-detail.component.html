<sd-side-drawer title="Chi tiết đơn hàng" width="600px" (sdClosed)="restore()">
  @if (record(); as row) {
    <div class="pattern-body">
      <h2>{{ row.code }} · {{ row.name }}</h2>
      <p>
        <span [class]="'badge ' + row.status">{{ labels[row.status] }}</span>
      </p>
      <dl class="facts">
        <dt>Khách hàng</dt>
        <dd>{{ row.name }}</dd>
        <dt>Khu vực</dt>
        <dd>{{ row.region }}</dd>
        <dt>Giá trị</dt>
        <dd>{{ row.amount.toLocaleString('vi-VN') }} ₫</dd>
        <dt>Phụ trách</dt>
        <dd>{{ row.owner }}</dd>
      </dl>
    </div>
  }
  <sd-button sdFooterRight title="Đóng" type="outline" (click)="drawer().close()" />
</sd-side-drawer>
