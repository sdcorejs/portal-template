function render(){document.querySelectorAll('[data-nav]').forEach(el=>{const type=el.dataset.nav;el.classList.toggle('active',type===layout);if(el.classList.contains('nav-item'))el.innerHTML=icon(type==='matrix'?'grid':'tree')+'<span>Role · '+(type==='matrix'?'Ma trận quyền':'Quyền phân cấp')+'</span>';el.onclick=event=>{if(saving){event.preventDefault();return;}if(dirty()&&routeView!=='detail'){event.preventDefault();pendingNavigate=()=>location.href=el.href;document.getElementById('leave-dialog').showModal();}};});
 const title=routeView==='list'?'Vai trò':routeView==='create'?'Tạo vai trò':(routeView==='update'?'Cập nhật vai trò ':'Chi tiết vai trò ')+'<span class="record-code">#'+esc(draft?.code||roleId)+'</span>';
 document.getElementById('header').innerHTML='<div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1>'+title+'</h1>'+(routeView==='detail'&&draft?badge(draft.status):'')+'</div>'+(routeView!=='list'&&routeView!=='create'&&draft?'<p class="description">'+esc(draft.name)+'</p>':'')+'</div><div class="actions">'+(routeView==='list'?'<button class="primary" id="create">'+icon('add')+'Tạo mới</button>':'<button class="link-button" id="back">'+icon('back')+'Quay lại</button>'+(draft?(routeView==='detail'?'<button class="primary" id="edit">'+icon('edit')+'Cập nhật</button>':'<button class="primary" id="save">'+icon('save')+'Lưu</button>'):''))+'</div>';
 document.getElementById('create')?.addEventListener('click',()=>navigate('create'));document.getElementById('back')?.addEventListener('click',()=>navigate());document.getElementById('edit')?.addEventListener('click',()=>navigate('update',roleId));document.getElementById('save')?.addEventListener('click',save);
 const content=document.getElementById('content');content.classList.remove('busy');content.classList.toggle('list-content',routeView==='list');
 if(routeView==='list'){renderList();return;}if(!draft){content.innerHTML='<div class="panel empty"><strong>Không tìm thấy vai trò</strong>Quay lại danh sách để chọn vai trò khác.</div>';return;}
 const read=routeView==='detail';
 content.innerHTML='<section class="panel"><div class="panel-title"><span class="title-left">'+icon('shield')+'Thông tin vai trò</span></div><div class="panel-body"><div class="form-grid">'+field('code','Mã vai trò',draft.code,true,read||routeView==='update')+field('name','Tên vai trò',draft.name,true,read)+'<label class="field status"><span>Trạng thái</span><select id="status" '+(read?'disabled':'')+'><option value="active">Đang hoạt động</option><option value="inactive">Ngừng hoạt động</option></select><small class="field-error"></small></label><label class="field full"><span>Mô tả</span><textarea id="description" '+(read?'readonly':'')+' maxlength="400">'+esc(draft.description)+'</textarea></label></div></div></section><section class="panel"><div class="panel-title"><span class="title-left">'+icon(layout==='matrix'?'grid':'tree')+'Phân quyền</span><span class="small muted" id="total-count"></span></div><div id="permissions"></div></section>';
 document.getElementById('status').value=draft.status;['code','name','status','description'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',()=>{draft[id]=el.value;el.classList.remove('invalid');const error=document.getElementById('error-'+id);if(error)error.textContent='';});});renderPermissions();
}
function field(id,label,value,required,read){return '<label class="field"><span>'+label+(required?' <b class="required">*</b>':'')+'</span><input id="'+id+'" maxlength="'+(id==='code'?40:120)+'" value="'+esc(value)+'" '+(read?'readonly':'')+' aria-describedby="error-'+id+'"><small id="error-'+id+'" class="field-error"></small></label>';}
function badge(status){return '<span class="badge '+(status==='active'?'':'inactive')+'">'+(status==='active'?'● Đang hoạt động':'● Ngừng hoạt động')+'</span>';}
function renderList(){const content=document.getElementById('content');content.innerHTML='<section class="panel table-panel"><div class="toolbar"><label class="search">'+icon('search')+'<input id="list-search" aria-label="Tìm vai trò" placeholder="Tìm mã hoặc tên vai trò" value="'+esc(listQuery)+'"></label><select id="list-status" aria-label="Lọc trạng thái"><option value="all">Tất cả trạng thái</option><option value="active">Đang hoạt động</option><option value="inactive">Ngừng hoạt động</option></select><div class="spacer"></div><span class="muted small" id="list-count"></span></div><div class="scroll"><table class="data-table"><thead><tr><th>Mã vai trò</th><th>Tên vai trò</th><th>Module</th><th>Số quyền</th><th>Người dùng</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody id="rows"></tbody></table><div id="list-empty" class="empty" hidden><strong>Không có vai trò phù hợp</strong>Thử từ khóa hoặc trạng thái khác.</div></div><div class="pager"><span id="range"></span><div class="actions"><span>10 / trang</span><button disabled aria-label="Trang trước">‹</button><button class="current" aria-label="Trang 1">1</button><button disabled aria-label="Trang sau">›</button></div></div></section>';
 document.getElementById('list-search').oninput=e=>{listQuery=e.target.value;renderRows();};document.getElementById('list-status').value=listStatus;document.getElementById('list-status').onchange=e=>{listStatus=e.target.value;renderRows();};renderRows();}
function renderRows(){const found=roles.filter(role=>(role.code+' '+role.name).toLocaleLowerCase('vi').includes(listQuery.toLocaleLowerCase('vi'))&&(listStatus==='all'||role.status===listStatus));document.getElementById('rows').innerHTML=found.map(role=>'<tr><td><a class="strong" href="'+url('detail',role.id)+'" data-role="'+role.id+'">'+esc(role.code)+'</a></td><td><strong style="font-weight:500">'+esc(role.name)+'</strong><div class="small muted" style="max-width:260px;margin-top:3px">'+esc(role.description)+'</div></td><td class="module-text">'+modules.filter(m=>role.permissions.some(id=>id.startsWith(m.id+'_'))).map(m=>m.name).join(', ')+'</td><td><span class="count">'+role.permissions.length+'</span></td><td>'+role.users+'</td><td>'+badge(role.status)+'</td><td class="muted">'+role.updated+'</td></tr>').join('');document.getElementById('list-count').textContent=found.length+' vai trò';document.getElementById('range').textContent=found.length?'1–'+found.length+' / '+found.length+' vai trò':'0 vai trò';document.getElementById('list-empty').hidden=!!found.length;document.querySelectorAll('[data-role]').forEach(a=>a.onclick=e=>{if(e.button===0&&!e.ctrlKey&&!e.metaKey){e.preventDefault();navigate('detail',a.dataset.role);}});}
function renderPermissions(){const mod=modules.find(m=>m.id===moduleId);const term=query.toLocaleLowerCase('vi').trim();const visible=mod.entities.filter(e=>(e.name+' '+e.hint+' '+permissions(mod,e).map(p=>p.label).join(' ')).toLocaleLowerCase('vi').includes(term)&&(!onlySelected||permissions(mod,e).some(p=>selected.has(p.id))));
 const visibleIds=visible.flatMap(e=>permissions(mod,e).map(p=>p.id));const totalModules=modules.filter(m=>m.entities.some(e=>permissions(m,e).some(p=>selected.has(p.id)))).length;
 document.getElementById('total-count').textContent=selected.size+' quyền · '+totalModules+' module';
 let html='<div class="tabs" role="tablist" aria-label="Module phân quyền">'+modules.map(m=>{const ids=m.entities.flatMap(e=>permissions(m,e).map(p=>p.id));return '<button class="tab '+(m.id===moduleId?'active':'')+'" role="tab" aria-selected="'+(m.id===moduleId)+'" data-module="'+m.id+'">'+esc(m.name)+' <span class="count">'+count(ids)+'</span></button>';}).join('')+'</div><div class="selection-tools"><label class="search">'+icon('search')+'<input id="permission-search" aria-label="Tìm chức năng hoặc quyền" placeholder="Tìm chức năng hoặc quyền" value="'+esc(query)+'"></label>'+checkbox(visibleIds,'Chọn tất cả quyền đang hiển thị','Chọn tất cả kết quả')+'<div class="spacer"></div><label class="check"><input type="checkbox" id="only-selected" '+(onlySelected?'checked':'')+'>Chức năng đã có quyền</label></div><div class="scroll" role="tabpanel" aria-label="'+esc(mod.name)+'">';
 if(!visible.length)html+='<div class="empty">'+icon('search')+'<strong>Không có chức năng phù hợp</strong>Thay đổi từ khóa hoặc bỏ bộ lọc đã có quyền.</div>';
 else if(layout==='matrix')html+='<table class="data-table matrix"><thead><tr><th class="feature">Chức năng</th>'+CRUD.map(([action,label])=>'<th class="crud-col">'+checkbox(visible.flatMap(e=>permissions(mod,e).filter(p=>p.action===action).map(p=>p.id)),'Chọn '+label+' cho các chức năng đang hiển thị',esc(label))+'</th>').join('')+'<th class="other-col">Other <span class="muted" style="font-weight:400">/ Quyền khác</span></th></tr></thead><tbody>'+visible.map(e=>{const perms=permissions(mod,e),ids=perms.map(p=>p.id);return '<tr><td class="feature"><div class="feature-label">'+checkbox(ids,'Chọn tất cả quyền '+e.name)+'<div><strong style="font-weight:600">'+esc(e.name)+'</strong><span class="sub">'+esc(e.hint)+'</span></div><span class="count">'+count(ids)+'</span></div></td>'+CRUD.map(([action,label])=>{const p=perms.find(p=>p.action===action);return '<td class="crud-col">'+(p?checkbox([p.id],label+' · '+e.name):'<span class="dash" aria-label="Không áp dụng '+label+'">—</span>')+'</td>';}).join('')+'<td class="other-col"><div class="other-options">'+(perms.filter(p=>p.type==='Other').map(p=>checkbox([p.id],p.label+' · '+e.name,esc(p.label))).join('')||'<span class="dash">—</span>')+'</div></td></tr>';}).join('')+'</tbody></table>';
 else html+='<table class="data-table tree"><thead><tr><th style="width:42%">Chức năng / Quyền</th><th style="width:130px">Nhóm thao tác</th><th>Phạm vi chức năng</th><th style="width:100px;text-align:center">Cho phép</th></tr></thead><tbody>'+visible.map(e=>{const perms=permissions(mod,e),ids=perms.map(p=>p.id);return '<tr class="tree-parent"><td><div class="tree-title"><button class="toggle" data-expand="'+e.id+'" aria-label="'+(expanded.has(e.id)?'Thu gọn ':'Mở rộng ')+esc(e.name)+'" aria-expanded="'+expanded.has(e.id)+'">'+icon(expanded.has(e.id)?'down':'chevron')+'</button>'+icon('folder')+esc(e.name)+'<span class="count">'+count(ids)+' / '+ids.length+'</span></div></td><td></td><td class="muted small">'+esc(e.hint)+'</td><td style="text-align:center">'+checkbox(ids,'Chọn tất cả quyền '+e.name)+'</td></tr>'+(expanded.has(e.id)?perms.map(p=>'<tr><td class="child-name">'+esc(p.label)+'</td><td><span class="badge '+p.type.toLowerCase()+'">'+p.type+'</span></td><td class="muted small">'+esc(e.name)+'</td><td style="text-align:center">'+checkbox([p.id],p.label+' · '+e.name)+'</td></tr>').join(''):'');}).join('')+'</tbody></table>';
 html+='</div><div class="legend"><span>'+visible.length+' chức năng · '+visibleIds.length+' quyền hiển thị</span><span>'+(layout==='matrix'?'— Không có quyền tương ứng':'Chọn hàng cha để chọn toàn bộ quyền con')+'</span></div>';document.getElementById('permissions').innerHTML=html;bindChecks();
 document.querySelectorAll('[data-module]').forEach((button,index,buttons)=>{button.onclick=()=>{moduleId=button.dataset.module;query='';renderPermissions();document.querySelector('[data-module="'+moduleId+'"]').focus();};button.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].click();}};});
 document.querySelectorAll('[data-expand]').forEach(button=>button.onclick=()=>{const id=button.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);renderPermissions();document.querySelector('[data-expand="'+id+'"]').focus();});
 document.getElementById('permission-search').oninput=e=>{const pos=e.target.selectionStart;query=e.target.value;renderPermissions();const input=document.getElementById('permission-search');input.focus();input.setSelectionRange(pos,pos);};
 document.getElementById('only-selected').onchange=e=>{onlySelected=e.target.checked;renderPermissions();document.getElementById('only-selected').focus();};
}
async function save(){if(saving||routeView==='detail')return;let invalid=false;for(const id of ['code','name']){const el=document.getElementById(id);draft[id]=el.value.trim();let message=!draft[id]?'Vui lòng nhập '+(id==='code'?'mã vai trò':'tên vai trò'):'';if(id==='code'&&draft.code&&!/^[A-Z0-9_-]+$/.test(draft.code))message='Dùng chữ in hoa, số, dấu - hoặc _';if(id==='code'&&roles.some(r=>r.code===draft.code&&r.id!==draft.id))message='Mã vai trò đã tồn tại';document.getElementById('error-'+id).textContent=message;el.classList.toggle('invalid',!!message);if(message&&!invalid){el.focus();invalid=true;}}if(invalid)return;
 saving=true;const btn=document.getElementById('save');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Đang lưu';document.getElementById('content').classList.add('busy');document.getElementById('back').disabled=true;
 await new Promise(resolve=>setTimeout(resolve,1000+Math.floor(Math.random()*1001)));
 const record={...draft,id:draft.id||'role-'+crypto.randomUUID(),permissions:[...selected],updated:new Intl.DateTimeFormat('vi-VN').format(new Date())};const next=roles.some(r=>r.id===record.id)?roles.map(r=>r.id===record.id?record:r):[record,...roles];
 try{sessionStorage.setItem(key(),JSON.stringify(next));roles=next;baseline='';draft=null;saving=false;navigate('detail',record.id,true);toast('Đã lưu vai trò '+record.name);}
 catch{saving=false;btn.disabled=false;btn.innerHTML=icon('save')+'Lưu';document.getElementById('content').classList.remove('busy');document.getElementById('back').disabled=false;toast('Không thể lưu phiên. Nội dung nhập vẫn được giữ.');}
}
let toastTimer;function toast(text){const el=document.getElementById('toast');el.textContent=text;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',4500);}
document.getElementById('stay').onclick=()=>document.getElementById('leave-dialog').close();document.getElementById('discard').onclick=()=>{document.getElementById('leave-dialog').close();pendingNavigate?.();};window.addEventListener('beforeunload',e=>{if(dirty()&&routeView!=='detail'){e.preventDefault();e.returnValue='';}});window.addEventListener('popstate',()=>{const target=location.href;if(routeView!=='detail'&&(saving||dirty())){history.pushState({},'',currentURL);if(saving)return;pendingNavigate=()=>{history.pushState({},'',target);readRoute();};document.getElementById('leave-dialog').showModal();return;}readRoute();});readRoute();
</script></body></html>
