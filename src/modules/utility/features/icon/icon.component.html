<sd-page [title]="'System Icons'" [description]="pageDescription()">
  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <div class="col-md-4">
        <sd-section title="Bộ lọc" icon="tune"
          ><div class="demo-property-content">
            <div class="demo-config-panel">
              <app-demo-property label="search">
                <span propertyDescription>Lọc icon theo tên.</span>
                <sd-input [(model)]="searchText" [placeholder]="'Ví dụ: user, settings, download'" hideInlineError size="sm"></sd-input
              ></app-demo-property>

              <app-demo-property label="iconSize">
                <span propertyDescription>Kích thước icon hiển thị.</span>
                <sd-input-number [(model)]="iconSize" [min]="16" [max]="48" hideInlineError size="sm"></sd-input-number
              ></app-demo-property>

              <app-demo-property label="copy">
                <span propertyDescription>Click một icon để copy tên dùng cho thuộc tính icon/prefixIcon/suffixIcon.</span>
                <div class="copy-note">
                  Đã copy: <strong>{{ copiedIcon() || '---' }}</strong>
                </div></app-demo-property
              >
            </div>
          </div></sd-section
        >
      </div>

      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Fill (material-icons)" icon="format_color_fill"
            ><div class="demo-section-content">
              <div class="icon-grid">
                @for (icon of filteredFillIcons(); track icon) {
                  <button type="button" class="icon-card" (click)="copyIcon(icon)">
                    <span class="material-icons" [style.fontSize.px]="iconSize()">{{ icon }}</span>
                    <span class="icon-name">{{ icon }}</span>
                  </button>
                }
              </div>
            </div></sd-section
          >

          <sd-section title="Outline (material-icons-outlined)" icon="pentagon"
            ><div class="demo-section-content">
              <div class="icon-grid">
                @for (icon of filteredOutlineIcons(); track icon) {
                  <button type="button" class="icon-card" (click)="copyIcon(icon)">
                    <span class="material-icons-outlined" [style.fontSize.px]="iconSize()">{{ icon }}</span>
                    <span class="icon-name">{{ icon }}</span>
                  </button>
                }
              </div>
            </div></sd-section
          >
        </div>
      </div>
    </div>
  </div>
</sd-page>
