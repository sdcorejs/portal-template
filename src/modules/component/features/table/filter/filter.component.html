<sd-page title="sd-table — Bộ lọc" [description]="pageDescription()">
  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <!-- CỘT TRÁI: THUỘC TÍNH -->
      <div class="col-md-4">
        <sd-section title="Thuộc tính" icon="settings"
          ><div class="demo-property-content">
            <div class="d-flex flex-column gap-12">
              <app-demo-property label="hideInlineFilter: false">
                <span propertyDescription>Hiển thị bộ lọc inline trong header mỗi cột</span>
                <sd-switch [(model)]="showInlineFilter" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="externalFilters">
                <span propertyDescription>Hiển thị panel lọc ngoài phía trên bảng</span>
                <sd-switch [(model)]="showExternalFilter" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              @if (showExternalFilter()) {
                <app-demo-property label="hideExternalFilterToolbar">
                  <span propertyDescription>Ẩn thanh công cụ (Xóa lọc, Ẩn/hiện)</span>
                  <sd-switch [(model)]="hideExternalFilterToolbar" hideInlineError size="sm"></sd-switch
                ></app-demo-property>

                <app-demo-property label="externalFilterPerRow">
                  <span propertyDescription>Số filter hiển thị mỗi hàng</span>
                  <sd-select
                    [items]="perRowOptions"
                    valueField="id"
                    displayField="name"
                    [(model)]="externalFilterPerRow"
                    hideInlineError
                    size="sm"></sd-select
                ></app-demo-property>
              }

              <app-demo-property label='Cột "Cấp độ" — filter.disabled' labelWidth="28%">
                <span propertyDescription>Tắt bộ lọc inline cho cột Cấp độ</span>
                <sd-switch [(model)]="disableLevelFilter" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label='Cột "Lương" — filter.disabled' labelWidth="28%">
                <span propertyDescription>Tắt bộ lọc inline cho cột Lương</span>
                <sd-switch [(model)]="disableSalaryFilter" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label='Cột "Họ và tên" — operator' labelWidth="28%">
                <span propertyDescription>Hiện dropdown chọn kiểu so sánh (CONTAIN, EQUAL…)</span>
                <sd-switch [(model)]="enableNameOperator" hideInlineError size="sm"></sd-switch
              ></app-demo-property>
            </div></div
        ></sd-section>
      </div>

      <!-- CỘT PHẢI: XEM TRƯỚC + MÃ NGUỒN -->
      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Xem trước" icon="visibility"
            ><div class="demo-section-content">
              <sd-table [option]="tableOption()"></sd-table></div
          ></sd-section>

          <sd-section title="Mã nguồn" icon="code"
            ><div class="demo-section-content">
              <sd-code-editor [model]="tsCode()" language="typescript" maxHeight="480px" [viewed]="true"></sd-code-editor></div
          ></sd-section>
        </div>
      </div>
    </div>
  </div>
</sd-page>
