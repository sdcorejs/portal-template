<div class="business-page" [inert]="store.operation() ? true : null">
  @if (loadError()) {
    <sd-data-state state="error" [title]="loadError()" />
  } @else if (component(); as active) {
    <app-demo-host [component]="active" />
  } @else {
    <div class="p-20"><sd-data-state state="loading" title="Đang tải dữ liệu…" /></div>
  }
</div>
@if (component() && store.operation()) {
  <div class="business-operation">
    <div><sd-data-state state="loading" [title]="store.operation()" /></div>
  </div>
}
