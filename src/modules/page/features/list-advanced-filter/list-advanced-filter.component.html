<div class="list-shell" [hidden]="view() === 'create' || view() === 'detail'">
  <sd-page [description]="exampleDescription" title="Danh sách đơn hàng"
    ><sd-button headerRight title="Tạo mới" type="fill" color="primary" prefixIcon="add" (click)="create()" />
    <div class="list-content">
      <div class="list-scorecards" role="group" aria-label="Thống kê toàn bộ đơn hàng">
        @for (card of scoreCards(); track card.label) {
          <sd-section [hideHeader]="true">
            <div class="p-12 d-flex flex-column gap-8">
              <div class="d-flex align-items-center gap-8">
                <span [class]="'score-icon p-8 rounded-8 bg-' + (card.tone === 'default' ? 'info' : card.tone) + '-light'">
                  <sd-icon
                    [name]="card.tone === 'warning' ? 'schedule' : card.tone === 'success' ? 'check_circle' : 'receipt_long'"
                    [class]="'text-' + (card.tone === 'default' ? 'info' : card.tone)" />
                </span>
                <span class="text-secondary fs-12">{{ card.label }}</span>
              </div>
              <strong class="fs-24">{{ card.value }}</strong>
            </div>
          </sd-section>
        }
      </div>
      @if (bulkMessage()) {
        <p role="status" class="list-result">{{ bulkMessage() }}</p>
      }
      <sd-table autoId="list-advanced-filter" [option]="option()">
        <ng-template sdTableCellDef="code" let-row="item">
          <a [href]="navigation.href('detail', row.id)" (click)="navigation.openLink($event, row.id)">{{ row.code }}</a>
        </ng-template>
      </sd-table>
    </div></sd-page
  >
</div>
@if (view() === 'create') {
  @if (store.kind === 'order') {
    <app-form-line-items [embedded]="true" (done)="back()" />
  } @else {
    <app-form-sections [embedded]="true" (done)="back()" />
  }
}
@if (view() === 'detail') {
  @if (store.kind === 'order') {
    <app-detail-related-records [embedded]="true" (done)="back()" />
  } @else {
    <app-detail-overview [embedded]="true" (done)="back()" />
  }
}
