<sd-page title="sd-table — Cơ bản" [description]="pageDescription()">
  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <!-- CỘT TRÁI: THUỘC TÍNH -->
      <div class="col-md-4">
        <sd-section title="Thuộc tính" icon="settings"
          ><div class="demo-property-content">
            <div class="d-flex flex-column gap-12">
              <app-demo-property label="type">
                <span propertyDescription>Chế độ xử lý: phía client hay server</span>
                <sd-select
                  [items]="tableTypeOptions"
                  valueField="id"
                  displayField="name"
                  [(model)]="tableType"
                  hideInlineError
                  size="sm"></sd-select
              ></app-demo-property>

              <app-demo-property label="paginate.pageSize">
                <span propertyDescription>Số dòng hiển thị mỗi trang</span>
                <sd-select
                  [items]="pageSizeOptions"
                  valueField="id"
                  displayField="name"
                  [(model)]="pageSize"
                  hideInlineError
                  size="sm"></sd-select
              ></app-demo-property>

              <app-demo-property label="config.visible">
                <span propertyDescription>Nút thiết lập hiển thị cột</span>
                <sd-switch [(model)]="showConfig" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="reload.visible">
                <span propertyDescription>Nút tải lại dữ liệu</span>
                <sd-switch [(model)]="showReload" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="export.visible">
                <span propertyDescription>Nút Export Excel/CSV</span>
                <sd-switch [(model)]="showExport" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="selector.visible">
                <span propertyDescription>Cột checkbox chọn dòng</span>
                <sd-switch [(model)]="showSelector" hideInlineError size="sm"></sd-switch
              ></app-demo-property>
            </div></div
        ></sd-section>
      </div>

      <!-- CỘT PHẢI: XEM TRƯỚC + MÃ NGUỒN -->
      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Xem trước" icon="visibility"
            ><div class="demo-section-content">
              @if (tableType() === 'server') {
                <div class="request-bar">
                  <strong class="request-bar__label">Yêu cầu gần nhất gửi server:</strong>
                  <span class="request-bar__value">{{ lastRequest() }}</span>
                </div>
              }
              <div style="height: 500px; overflow: auto">
                <sd-table [option]="tableOption()"></sd-table>
              </div></div
          ></sd-section>

          <sd-section title="Mã nguồn" icon="code"
            ><div class="demo-section-content">
              <sd-code-editor [model]="tsCode()" language="typescript" maxHeight="480px" [viewed]="true"></sd-code-editor></div
          ></sd-section>
        </div>
      </div>
    </div>
  </div>
</sd-page>
