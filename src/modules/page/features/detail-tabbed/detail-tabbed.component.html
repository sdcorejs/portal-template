@for (key of [store.mode() + ':' + store.selectedId()]; track key) {
  @if (store.mode() !== 'detail') {
    @if (store.formLayout() === 'simple') {
      <app-form-simple [embedded]="true" />
    } @else if (store.kind === 'order') {
      <app-form-line-items [embedded]="true" />
    } @else {
      <app-form-sections [embedded]="true" />
    }
  } @else {
    @if (entity(); as row) {
      <sd-page [title]="'Chi tiết #' + row.code">
        <div headerLeft class="d-flex align-items-center gap-8">
          <sd-button tooltip="Quay lại" type="text" prefixIcon="arrow_back" (click)="back()" /><app-record-header
            [kind]="store.kind"
            [entity]="row" />
        </div>
        <div headerRight class="record-actions">
          <sd-button title="Cập nhật" type="fill" color="primary" prefixIcon="edit" (click)="edit()" />
        </div>
        <div class="bg-white">
          <sd-tab-group [(selectedIndex)]="activeTab" [stretchTabs]="false" alignTabs="start"
            ><sd-tab label="Thông tin chung" icon="info"
              ><div class="p-12 bg-light"><app-entity-facts [entity]="row" /></div></sd-tab
            ><sd-tab label="Hạng mục liên quan" icon="list_alt"
              ><div class="p-12 bg-light"><app-related-records [lines]="row.lines" /></div></sd-tab
          ></sd-tab-group></div
      ></sd-page>
    } @else {
      <sd-data-state
        state="error"
        title="Không tìm thấy hồ sơ"
        message="Hồ sơ có thể đã thay đổi. Quay lại danh sách để chọn lại."
        actionLabel="Quay lại"
        (sdAction)="back()" />
    }
  }
}
