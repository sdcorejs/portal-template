<sd-page title="sd-query-bar — Modes & Density" [description]="pageDescription()">
  <div class="demo-page-body">
    <div class="row row-sm mx-0">
      <!-- CỘT TRÁI: TOGGLES -->
      <div class="col-md-4">
        <sd-section title="Thuộc tính" icon="settings"
          ><div class="demo-property-content">
            <div class="d-flex flex-column gap-12">
              <app-demo-property label="mode">
                <span propertyDescription>popover (compact) vs inline (GitLab-style)</span>
                <sd-select [items]="modeOptions" valueField="id" displayField="name" [(model)]="mode" hideInlineError size="sm"></sd-select
              ></app-demo-property>

              <app-demo-property label="density">
                <span propertyDescription>Chiều cao chip + control</span>
                <sd-select
                  [items]="densityOptions"
                  valueField="id"
                  displayField="name"
                  [(model)]="density"
                  hideInlineError
                  size="sm"></sd-select
              ></app-demo-property>

              <app-demo-property label="showSearch">
                <span propertyDescription>Free-text search box bên trái</span>
                <sd-switch [(model)]="showSearch" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="showLogicToggle">
                <span propertyDescription>AND/OR — chỉ render khi có ≥2 chip</span>
                <sd-switch [(model)]="showLogicToggle" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="showOperatorOnChip">
                <span propertyDescription>In operator label lên mặt chip</span>
                <sd-switch [(model)]="showOperatorOnChip" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <app-demo-property label="showClearAll">
                <span propertyDescription>Nút "Xoá hết" khi có filter</span>
                <sd-switch [(model)]="showClearAll" hideInlineError size="sm"></sd-switch
              ></app-demo-property>

              <div class="counter mt-12">
                apply: <strong>{{ applyCount() }}</strong> · logic: <strong>{{ logic() }}</strong>
              </div>
            </div>
          </div></sd-section
        >
      </div>

      <!-- CỘT PHẢI: COMPONENT + JSON -->
      <div class="col-md-8">
        <div class="d-flex flex-column gap-16">
          <sd-section title="Component" icon="visibility"
            ><div class="demo-section-content">
              <sd-query-bar
                [fields]="fields"
                [(filters)]="filters"
                [(logic)]="logic"
                [(search)]="search"
                [mode]="mode()"
                [density]="density()"
                [showSearch]="showSearch()"
                [showLogicToggle]="showLogicToggle()"
                [showOperatorOnChip]="showOperatorOnChip()"
                [showClearAll]="showClearAll()"
                (apply)="onApply()">
              </sd-query-bar></div
          ></sd-section>

          <sd-section title="Composite query() — payload gửi backend" icon="data_object"
            ><div class="demo-section-content">
              <pre class="json">{{ queryJson() }}</pre>
            </div></sd-section
          >

          <sd-section title="Mã nguồn" icon="code"
            ><div class="demo-section-content">
              <sd-code-editor [model]="tsCode()" language="html" maxHeight="420px" [viewed]="true"></sd-code-editor></div
          ></sd-section>
        </div>
      </div>
    </div>
  </div>
</sd-page>
